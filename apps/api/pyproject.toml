[project]
name = "napkin-api"
version = "0.1.0"
description = "Napkin FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napkin_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]

